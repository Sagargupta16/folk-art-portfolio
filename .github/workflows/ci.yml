name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

# Least-privilege default: CI only reads the repo to lint/typecheck/build.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    # Display name is pinned to the required status check in the "main
    # protection" ruleset -- rename both together or merges to main block.
    name: lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      KALCHAR_TEST_FIXTURES: "1"
      NEXT_PUBLIC_IMAGE_BASE_URL: https://fixtures.invalid
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Create temporary authentication secret
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "AUTH_SECRET=" + require("node:crypto").randomBytes(32).toString("hex") + "\n")'

      - name: Lint
        run: pnpm lint

      - name: Migration artifact guard
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -qx 'lib/db/schema.ts'; then
            if ! git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -Eq '^drizzle/[0-9].*\.sql$'; then
              echo '::error::lib/db/schema.ts changed without a committed SQL migration.'
              exit 1
            fi
          fi

      - name: Elevation-token guard
        # The design system routes ALL depth through the tokenized elevation
        # scale (shadow-e0..e5 + shadow-hairline, globals.css). Raw Tailwind
        # shadows and ad-hoc black/white rings were migrated out in v1.33.0;
        # this fails the build if drift creeps back in.
        run: |
          if grep -rEn 'shadow-(sm|md|lg|xl|2xl)\b|ring-(black|white)/' components/ app/ --include='*.tsx'; then
            echo '::error::Raw shadow/ring utility found. Use the elevation tokens (shadow-e0..e5, shadow-hairline) instead. See docs/UI-CONSISTENCY-PLAN.md.'
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck scripts
        run: pnpm typecheck:scripts

      - name: Typecheck browser fixtures
        run: pnpm typecheck:tests

      - name: Test
        # Pure logic, isolated action checks and disposable database migrations.
        run: pnpm test

      - name: Test operational safeguards
        run: pnpm test:operations

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_PORT: 3001

  migrations:
    name: database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kalchar_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d kalchar_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/kalchar_migration_test
      PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate migration artifacts
        run: pnpm db:validate
      - name: Verify migrations and concurrent bootstrap on disposable PostgreSQL
        run: pnpm db:check
